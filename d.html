<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F2E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Dashboard</title>
<style>
  html,body{margin:0;height:100%;background:#E1DDC7;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#2A2E2C}
  iframe{border:0;width:100%;height:100vh;height:100dvh;display:block}
  p{padding:24px;margin:0}
</style>
</head>
<body>
<!-- Contenitore delle dashboard dei negozi: la mostra dentro questa pagina, cosi' Google non aggiunge in alto
     la scritta "Questa applicazione e' stata creata da un utente di Google Apps Script".
     La chiave sta dopo il # e non arriva a questo sito: la riceve solo Google, come col link diretto. -->
<script>
(function () {
  var DEPLOY = 'https://script.google.com/macros/s/AKfycbxv9ZkBkTkEoEdv7bYV4fXkHlZZab7F5Lm4EoDUKZx-tKeqTTD28s_w7n6TOtct5Xre/exec';
  var p = new URLSearchParams(location.hash.slice(1));
  var k = (p.get('k') || '').replace(/[^0-9a-f]/gi, '');
  if (!k) { document.body.innerHTML = '<p>Link non valido.</p>'; return; }
  var f = document.createElement('iframe');
  f.title = 'Dashboard';
  f.allow = 'clipboard-write';
  f.src = DEPLOY + '?k=' + k + (p.get('apri') === 'report' ? '&apri=report' : '') + (p.get('tema') ? '&tema=' + encodeURIComponent(p.get('tema')) : '');
  document.body.appendChild(f);
})();
</script>
</body>
</html>
